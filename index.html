<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"></link>
    <title>
      もぐろぐ
    </title>
  </head>

  <body>
    <div class="header">
      <h1>
      もぐろぐ
      </h1>
    </div>

    <form id="recruitment-form">

      <div class="boshu">
        <h2>募集する</h2>

        <label for="name">名前:</label>
        <input type="text" id="name" name="name" placeholder="例: さくら">
        
        <label for="time">日時:</label>
        <input type="text" id="time" name="time" placeholder="例: 10/1 18:00〜20:00">
        
        <label for="shop">お店:</label>
        <input type="text" id="shop" name="shop" placeholder="例: 〇〇カフェ">  
      
        <label for="participants">人数:</label>
        <input type="number" id="participants" name="participants" min="1" step="1" placeholder="例: 2">
        
        <label for="message">メッセージ:</label>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="募集内容を入力してください"></textarea>
      </div>

      <div class="button-container">
        <button type="submit">
          募集する
        </button>
        <button type="reset">
          キャンセル
        </button>

      </div>
  </form>

    <br>
    <hr>
    <br>
    <section id="recruitments">
    <div id="firebase-recruitments"></div>
    <div>
    <article class="recruitment">

        <button type="button" onclick="closeRecruitment(this)" class = "button-close">締切</button>

    </article>

    <article class="recruitment">

      <div class="button-container">
        <button type="button" onclick="go(this)" class="button-go">行く</button>

        <button type="button" onclick="closeRecruitment(this)" class = "button-close">締切</button>

    <article class="recruitment">
      <p>ケイト</p>

        <li>1人</li>
        <li>ひとりさみしい</li>
      </ul>
      
      <div class="button-container">
        <button type="button" onclick="go(this)" class="button-go">行く</button>
      <button type="button" onclick="talk(this)" class="button-talk">話す</button>
        <button type="button" onclick="closeRecruitment(this)" class = "button-close">締切</button>
        <p class="status"></p>
      </div>
    </article>

    <article class="recruitment">
      <p>さおりん</p>

        <li>18時</li>
        <li>zeyo</li>
        <li>1人</li>
        <li>カレーうどん食べよ</li>
      </ul>
      <div class="button-container">
        <button type="button" onclick="go(this)" class="button-go">行く</button>
        <button type="button" onclick="talk(this)" class="button-talk">話す</button>

    <article class="recruitment">
      <p>ちゃが</p>
      <ul class="recuruitment-info">
        <li>20時</li>
        <li>あじさい</li>
        <li>3人</li>
        <li>飲もう！</li>
      </ul>

      <div class="button-container">
        <button type="button" onclick="go(this)" class="button-go">行く</button>
        <button type="button" onclick="talk(this)" class="button-talk">話す</button>
        <button type="button" onclick="closeRecruitment(this)" class = "button-close">締切</button>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
      firebase.initializeApp(window.firebaseConfig);
      const db = firebase.firestore();
      const recruitmentForm = document.getElementById('recruitment-form');
      const recruitmentList = document.getElementById('firebase-recruitments');

      function createRecruitment(post) {
        const article = document.createElement('article');
        article.className = 'recruitment';
        article.dataset.recruitmentId = post.id || '';

        const name = document.createElement('p');
        name.textContent = post.name;
        article.appendChild(name);

        const details = document.createElement('ul');
        const participantsMax = Number(post.participants_max ?? post.guest ?? 0);
        const participants = Number(post.participants ?? 1);
        [post.time, post.shop, post.message].forEach(function (value) {
          const item = document.createElement('li');
          item.textContent = value;
          details.appendChild(item);
        });
        article.appendChild(details);

        const participantCount = document.createElement('p');
        participantCount.className = 'participant-count';
        participantCount.textContent = `参加人数: ${participants} / ${participantsMax}`;
        article.appendChild(participantCount);

        const participantNames = document.createElement('p');
        participantNames.className = 'participant-names';
        const names = Array.isArray(post.participantNames) ? post.participantNames : [];
        participantNames.textContent = names.length > 0
          ? `参加者: ${names.join('、')}`
          : '参加者: まだいません';
        article.appendChild(participantNames);

        const participantName = document.createElement('input');
        participantName.type = 'text';
        participantName.className = 'participant-name';
        participantName.placeholder = '参加する名前を入力してください';
        const joinedName = post.id ? localStorage.getItem(`moglog_joined_${post.id}`) || '' : '';
        participantName.value = joinedName === 'true' ? '' : joinedName;
        article.appendChild(participantName);

        const buttonContainer = document.createElement('div');
        buttonContainer.className = 'button-container';

        const goButton = document.createElement('button');
        goButton.type = 'button';
        goButton.className = 'button-go';
        goButton.textContent = '行く';
        goButton.disabled = !participantName.value.trim();
        participantName.addEventListener('input', function () {
          goButton.disabled = !participantName.value.trim();
        });
        goButton.onclick = function () {
          toggleParticipation(goButton, post.id, participantName);
        };
        if (joinedName && joinedName !== 'true') {
          article.classList.add('joined');
          goButton.textContent = '行かない';
        }
        buttonContainer.appendChild(goButton);

        const talkButton = document.createElement('button');
        talkButton.type = 'button';
        talkButton.className = 'button-talk';
        talkButton.textContent = '話す';
        talkButton.onclick = function () {
          talk(talkButton);
        };
        buttonContainer.appendChild(talkButton);

        const closeButton = document.createElement('button');
        closeButton.type = 'button';
        closeButton.className = 'button-close';
        closeButton.textContent = '締切';
        closeButton.onclick = function () {
          closeRecruitment(closeButton);
        };
        buttonContainer.appendChild(closeButton);

        const status = document.createElement('p');
        status.className = 'status';
        article.appendChild(buttonContainer);
        article.appendChild(status);

        return article;
      }

      function migrateGuestField(document) {
        const data = document.data();
        if (data.guest === undefined || data.participants_max !== undefined) {
          return;
        }

        db.collection('recruitments').doc(document.id).update({
          participants_max: Number(data.guest),
          participants: Number(data.participants ?? 1),
          guest: firebase.firestore.FieldValue.delete()
        });
      }

      db.collection('recruitments').orderBy('createdAt', 'desc').onSnapshot(function (snapshot) {
        recruitmentList.replaceChildren();
        snapshot.forEach(function (document) {
          migrateGuestField(document);
          recruitmentList.appendChild(createRecruitment({
            id: document.id,
            ...document.data()
          }));
        });
      }, function (error) {
        console.error('募集一覧の取得に失敗しました:', error);
      });

      recruitmentForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const post = {
          name: document.getElementById('name').value.trim(),
          time: document.getElementById('time').value.trim(),
          shop: document.getElementById('shop').value.trim(),
          message: document.getElementById('message').value.trim(),
          participants_max: Number(document.getElementById('participants').value.trim()),
          participants: 1
        };

        if (!post.name || !post.time || !post.shop || !post.message || !Number.isInteger(post.participants_max) || post.participants_max < 1) {
          return;
        }

        db.collection('recruitments').add({
          ...post,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
          recruitmentForm.reset();
        }).catch(function (error) {
          console.error('募集の投稿に失敗しました:', error);
          window.alert('投稿に失敗しました。Firebaseの設定と接続を確認してください。');
        });
      });

      function updateStatus(button, message) {
        const recruitment = button.closest('.recruitment');
        recruitment.querySelector('.status').textContent = message;
      }

      function go(button) {
        updateStatus(button, '行くことにしました');
      }

      function toggleParticipation(button, recruitmentId, participantNameInput) {
        if (!recruitmentId) {
          go(button);
          return;
        }

        const recruitment = button.closest('.recruitment');
        const joinedKey = `moglog_joined_${recruitmentId}`;
        const joinedName = localStorage.getItem(joinedKey) || '';
        const isJoined = Boolean(joinedName);
        const participantName = participantNameInput.value.trim();
        const recruitmentRef = db.collection('recruitments').doc(recruitmentId);

        if (!participantName) {
          button.disabled = true;
          updateStatus(button, '名前を入力してください');
          return;
        }

        db.runTransaction(function (transaction) {
          return transaction.get(recruitmentRef).then(function (document) {
            const data = document.data() || {};
            const participantsMax = Number(data.participants_max ?? data.guest ?? 0);
            const participants = Number(data.participants ?? 1);
            const participantNames = Array.isArray(data.participantNames)
              ? data.participantNames
              : [data.name].filter(Boolean);

            if (!isJoined && participants >= participantsMax) {
              throw new Error('FULL');
            }

            if (!isJoined && participantNames.includes(participantName)) {
              throw new Error('DUPLICATE_NAME');
            }

            const nextParticipants = isJoined
              ? Math.max(1, participants - 1)
              : participants + 1;
            const nextParticipantNames = isJoined
              ? participantNames.filter(function (name) {
                return name !== joinedName;
              })
              : participantNames.concat(participantName);
            transaction.update(recruitmentRef, {
              participants_max: participantsMax,
              participants: nextParticipants,
              participantNames: nextParticipantNames
            });
          });
        }).then(function () {
          const nextJoined = !isJoined;
          if (nextJoined) {
            localStorage.setItem(joinedKey, participantName);
          } else {
            localStorage.removeItem(joinedKey);
          }
          recruitment.classList.toggle('joined', nextJoined);
          updateStatus(button, nextJoined ? '行くことにしました' : '行かないことにしました');
          button.textContent = nextJoined ? '行かない' : '行く';
        }).catch(function (error) {
          if (error.message === 'FULL') {
            updateStatus(button, '定員に達しています');
            return;
          }
          if (error.message === 'DUPLICATE_NAME') {
            updateStatus(button, 'その名前はすでに参加しています');
            return;
          }
          console.error('参加人数の更新に失敗しました:', error);
          updateStatus(button, '更新に失敗しました');
        });
      }

      function talk(button) {
        updateStatus(button, '話します');
      }

      function closeRecruitment(button) {
        const recruitment = button.closest('.recruitment');
        recruitment.classList.remove('joined');
        recruitment.classList.add('closed');
        updateStatus(button, '締め切りました');
        recruitment.querySelectorAll('button').forEach(function (recruitmentButton) {
          recruitmentButton.disabled = true;
        });
      }

    </script>
  </body>
</html>

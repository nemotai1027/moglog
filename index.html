<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <title>
      もぐろぐ
    </title>
  </head>

  <body>
    <h1>
      もぐろぐ
    </h1>
    <form action="recruit.html" method="get">
      <div>
        <label for="name">名前:</label><br>
        <input type="text" id="name" name="name" placeholder="例: さくら">
      </div>
      <div>
        <label for="time">時間:</label><br>
        <input type="text" id="time" name="time" placeholder="例: 18:00〜20:00">
      </div>
      <div>
        <label for="shop">お店:</label><br>
        <input type="text" id="shop" name="shop" placeholder="例: 〇〇カフェ">
      </div>
      <div>
        <label for="message">メッセージ:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="募集内容を入力してください"></textarea>
      </div>
      <br>
      <button type="submit">
        募集する
      </button>
    </form>
  </body>
</html>

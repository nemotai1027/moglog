<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"></link>
    <title>
      もぐろぐ
    </title>
  </head>

  <body>
    <div class="header">
      <h1>
      もぐろぐ
      </h1>
    </div>

    <!-- <form action="recruit.html" method="get"> -->

      <div class="boshu">
        <br>
       <h2>募集する</h2>

        <label for="name">名前:</label>
        <input type="text" id="name" name="name" placeholder="例: さくら">
        <br>

        <label for="time">日時:</label>
        <input type="text" id="time" name="time" placeholder="例: 10/1 18:00〜20:00">
        <br>

        <label for="shop">お店:</label>
        <input type="text" id="shop" name="shop" placeholder="例: 〇〇カフェ">
        <br>
        
        <label for="message">メッセージ:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="募集内容を入力してください"></textarea>
        
          
        <div class="button-container">
          <button type="submit">
            募集する
          </button>
          <button type="reset">
            キャンセル
          </button>
        </div>

        <hr>

      </div>

    <!-- </form> -->

    <div>
      <article class="recruitment">
      <p>ここ</p>
      <ul>
        <li>20時</li>
        <li>デニーズ</li>
        <li>デニーズのパフェ食べましょー</li>
      </ul>
      <button type="button" onclick="go(this)">行く</button>
      <button type="button" onclick="talk(this)">話す</button>
      <button type="button" onclick="closeRecruitment(this)">締切</button>
      <p class="status"></p>
    </article>

    <article class="recruitment">
      <p>あやか</p>
      <ul>
        <li>21時</li>
        <li>天久保ココス</li>
        <li>ハンバーグ食べたい</li>
      </ul>
     
      <button type="button" onclick="go(this)">行く</button>
      <button type="button" onclick="talk(this)">話す</button>
      <button type="button" onclick="closeRecruitment(this)">締切</button>
      <p class="status"></p>
    </article>

    <article class="recruitment">
      <p>ケイト</p>
      <ul>
        <li>19時</li>
        <li>春4ファミマ</li>
        <li>ひとりさみしい</li>
      </ul>
      <button type="button" onclick="go(this)">行く</button>
      <button type="button" onclick="talk(this)">話す</button>
      <button type="button" onclick="closeRecruitment(this)">締切</button>
      <p class="status"></p>
    </article>

    <article class="recruitment">
      <p>さおりん</p>
      <ul>
        <li>18時</li>
        <li>zeyo</li>
        <li>カレーうどん食べよ</li>
      </ul>
      <button type="button" onclick="go(this)">行く</button>
      <button type="button" onclick="talk(this)">話す</button>
      <button type="button" onclick="closeRecruitment(this)">締切</button>
      <p class="status"></p>
    </article>

    <article class="recruitment">
      <p>ちゃが</p>
      <ul>
        <li>20時</li>
        <li>あじさい</li>
        <li>飲もう！</li>
      </ul>
      <button type="button" onclick="go(this)">行く</button>
      <button type="button" onclick="talk(this)">話す</button>
      <button type="button" onclick="closeRecruitment(this)">締切</button>
      <p class="status"></p>
    </article>
    </div>
  
    

    <script>
      function updateStatus(button, message) {
        const recruitment = button.closest('.recruitment');
        recruitment.querySelector('.status').textContent = message;
      }

      function go(button) {
        updateStatus(button, '行くことにしました');
      }

      function talk(button) {
        updateStatus(button, '話しかけました');
      }

      function closeRecruitment(button) {
        updateStatus(button, '締め切りました');
        button.closest('.recruitment').querySelectorAll('button').forEach(function (recruitmentButton) {
          recruitmentButton.disabled = true;
        });
      }
    </script>
  </body>
</html>

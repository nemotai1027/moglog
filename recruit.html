<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <title>
        募集中
    </title>
  </head>

  <body>
    <h1>
      募集中！
    </h1>
    <div id="result">
      <p>未入力です</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '未入力';
      const time = params.get('time') || '未入力';
      const shop = params.get('shop') || '未入力';
      const message = params.get('message') || '未入力';
      const result = document.getElementById('result');

      result.innerHTML = `
        ${name}<br>
        ${time}<br>
        ${shop}<br>
        ${message}
      `;
    </script>
  </body>
</html>

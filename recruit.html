<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <title>
        募集中
    </title>
  </head>

  <body>
    <h1>
      募集中！
    </h1>
    <p id="result">未入力です</p>

    <script>
      const params = new URLSearchParams(window.location.search);
      const message = params.get('message');
      const result = document.getElementById('result');

      if (message) {
        result.textContent = message;
      }
    </script>
  </body>
</html>
